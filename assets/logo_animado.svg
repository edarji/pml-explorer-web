<!-- Logo animado de PML Explorer: saxofón ámbar que se mece, rayo azul que parpadea y notas que suben.
     Solo CSS dentro del SVG. El efecto al pasar el mouse vive en explorer.py. -->
<svg class="pml-logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="PML Explorer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
       .pml-logo .sax { transform-origin: 36px 56px; animation: mecer 3s ease-in-out infinite; transition: transform .3s, filter .3s; }
    .pml-logo .rayo { transform-origin: 48px 18px; animation: chispa 2.4s steps(1) infinite; }
    .pml-logo .nota { opacity: 0; animation: subir 3s ease-out infinite; }
    .pml-logo .n2 { animation-delay: 1s; }
    .pml-logo .n3 { animation-delay: 2s; }
    @keyframes mecer { 0%, 100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    @keyframes chispa { 0%, 40%, 50%, 100% { opacity: 1; } 45%, 55% { opacity: .2; } }
    @keyframes subir { 0% { opacity: 0; transform: translate(0, 0); } 20% { opacity: 1; } 100% { opacity: 0; transform: translate(-8px, -14px); } }
  </style>
  <g class="sax" fill="none" stroke="#FFB000" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 8 L16 6 Q24 4 26 12" stroke-width="3"/>
    <path d="M26 12 L26 44 Q26 56 36 56 Q46 56 46 44 L46 36" stroke-width="6"/>
    <path d="M40 34 L52 34 L50 38 L42 38 Z" fill="#FFB000" stroke-width="2"/>
    <circle cx="26" cy="22" r="1.6" fill="#000" stroke="none"/>
    <circle cx="26" cy="30" r="1.6" fill="#000" stroke="none"/>
    <circle cx="26" cy="38" r="1.6" fill="#000" stroke="none"/>
  </g>
  <path class="rayo" d="M50 4 L40 20 L47 20 L42 32 L56 14 L48 14 L54 4 Z" fill="#00BFFF"/>
  <g fill="#FFB000">
    <text class="nota n1" x="52" y="46" font-size="8">♪</text>
    <text class="nota n2" x="56" y="50" font-size="7">♫</text>
    <text class="nota n3" x="50" y="52" font-size="6">♪</text>
  </g>
</svg>
