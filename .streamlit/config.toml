[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# v0.6.3 · Identidad «Dark Trading» (Bloomberg Black + Apple Bolsa): fondo negro, superficies grafito,
# texto casi blanco, ámbar del logo sax como acento y serie principal, verde/rojo de Apple solo para cambios.
# Sustituye al tema claro «ficha de mercado» (v0.5–v0.6.2). Solo presentación: ningún cálculo cambia.
[theme]
base = "dark"
backgroundColor = "#000000"
secondaryBackgroundColor = "#1C1C1E"
textColor = "#F2F2F7"
primaryColor = "#FFB000"
borderColor = "#2C2C2E"
linkColor = "#FFB000"
font = "sans-serif"
baseRadius = "0.5rem"
greenColor = "#30D158"
redColor = "#FF453A"
chartCategoricalColors = ["#FFB000", "#0A84FF", "#8E8E93", "#30D158"]
