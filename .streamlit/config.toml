[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# Tema visual claro tipo «ficha de mercado» (v0.5): fondo crema, texto casi negro, línea naranja,
# verde/rojo solo para cambios. Sustituye al tema oscuro tipo terminal (ámbar sobre negro).
[theme]
base = "light"
backgroundColor = "#FBF8F2"
secondaryBackgroundColor = "#F3EEE5"
textColor = "#1B1B1B"
primaryColor = "#E8772E"
borderColor = "#E4DDD0"
linkColor = "#1B1B1B"
font = "sans-serif"
baseRadius = "0.5rem"
greenColor = "#2E7D32"
redColor = "#C62828"
chartCategoricalColors = ["#E8772E", "#2F6FB0", "#8E8E8E", "#2E7D32"]
