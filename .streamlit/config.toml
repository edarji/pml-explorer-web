[server]
headless = true
enableCORS = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

# v0.8.0 · «Graphite híbrido» (dirección de producto, Issue #19 / PR #24, 2026-11-20): fondo gris tipo Apple Bolsa,
# tarjetas claras, panel de análisis grafito y serie ámbar. Sustituye al fondo negro de Dark Trading (v0.6.3–v0.7.0).
# Solo presentación: ningún cálculo cambia. Los colores del panel grafito se fijan en ESTILOS (app.py).
[theme]
base = "light"
backgroundColor = "#E8E9EC"
secondaryBackgroundColor = "#F7F7F8"
textColor = "#1C1C1E"
primaryColor = "#FFB000"
borderColor = "#D5D7DB"
linkColor = "#8A5300"
font = "sans-serif"
baseRadius = "0.5rem"
greenColor = "#1E8E3E"
redColor = "#D70015"
chartCategoricalColors = ["#FFB000", "#0A84FF", "#8E8E93", "#30D158"]
